<h1>Listado de posts</h1>
<ul>
  {% for post in posts %}
    <li>
      {{ forloop.counter }}.
      <a href="{% url 'detalle_post' post.id %}">{{ post.titulo|upper }}</a>
      - {{ post.autor }} - {{ post.fecha | date:"d/m/Y" }}
      {% if not post.publicado %}<em>(borrador)</em>{% endif %}
    </li>
  {% empty %}
    <li>Todavía no hay posts.</li>
  {% endfor %}
</ul>
