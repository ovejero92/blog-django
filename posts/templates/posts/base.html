{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{% static 'posts/css/style.css' %}">
  <title>{% block title %}Mi Blog{% endblock %}</title>
</head>
<body>
  <header class="site-header">
    <h1>Mi Blog</h1>
    <nav class="site-nav">
      <a href="{% url 'inicio' %}">Inicio</a>
      <a href="{% url 'lista_posts' %}">Posts</a>
      <a href="{% url 'acerca_de' %}">Acerca de</a>
      <a href="{% url 'contacto' %}">Contacto</a>
    </nav>
  </header>
  <main class="site-main">
    {% block content %}
    {% endblock %}
  </main>
  <footer class="site-footer">
    <p>Creado con Django</p>
  </footer>

  <script src="{% static 'posts/js/main.js' %}"></script>
</body>
</html>
